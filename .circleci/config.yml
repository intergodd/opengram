version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  build:
    executor:
      name: win/server-2022
      size: "medium"
    
    steps:
      - checkout

      - run:
          name: Update Submodules
          command: git submodule update --init --recursive

      - run:
          name: Prepare Dependencies
          shell: cmd.exe
          command: |
            set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
            for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
            call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64
            cd Telegram\build\prepare
            call win.bat silent

      - run:
          name: CMake Configure & Build
          shell: cmd.exe
          command: |
            set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
            for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSDIR=%%i
            call "%VSDIR%\VC\Auxiliary\Build\vcvarsall.bat" x64
            cd Telegram
            call configure.bat x64 -D TDESKTOP_API_ID=29752883 -D TDESKTOP_API_HASH=660c7a8e6afba4eaf178b61a19aec18d -D CMAKE_CONFIGURATION_TYPES=MinSizeRel -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF
            cmake --build out --config MinSizeRel --parallel

      - store_artifacts:
          path: out/MinSizeRel
          destination: build_output
